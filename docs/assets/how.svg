<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>How a reply is made: the patient asks, the route handler adds the booking context and a guardrail prompt, Gemini answers from that context, and the app replies, escalates to a human or asks for a rating</title><rect width="1280" height="252" rx="24" fill="#f5f3fb"/><rect x="28.0" y="28" width="295.5" height="196" rx="18" fill="#ffffff" stroke="#e6e1f4"/><text x="50.0" y="62" fill="#7C5CC4" font-size="14" font-weight="800" letter-spacing="2.5">1 · PATIENT</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="50.0" y="96.0">Asks in plain words</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="50.0" y="130.2">&quot;My phlebotomist hasn&#x27;t</tspan><tspan x="50.0" y="151.9">arrived.&quot; The full conversation</tspan><tspan x="50.0" y="173.7">goes to the server.</tspan></text><rect x="337.5" y="28" width="295.5" height="196" rx="18" fill="#ffffff" stroke="#e6e1f4"/><text x="359.5" y="62" fill="#7C5CC4" font-size="14" font-weight="800" letter-spacing="2.5">2 · SERVER</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="359.5" y="96.0">Adds the booking</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="359.5" y="130.2">The route handler injects the</tspan><tspan x="359.5" y="151.9">appointment, provider, slot and</tspan><tspan x="359.5" y="173.7">package, plus a guardrail</tspan><tspan x="359.5" y="195.4">prompt.</tspan></text><rect x="647.0" y="28" width="295.5" height="196" rx="18" fill="#7C5CC4"/><text x="669.0" y="62" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="2.5">3 · GEMINI</text><text fill="#ffffff" font-size="21" font-weight="800" text-anchor="start"><tspan x="669.0" y="96.0">Answers from context</tspan></text><text fill="#ffffff" fill-opacity="0.9" font-size="15" font-weight="400" text-anchor="start"><tspan x="669.0" y="130.2">Two or three human sentences,</tspan><tspan x="669.0" y="151.9">specific to this booking, or an</tspan><tspan x="669.0" y="173.7">escalation signal.</tspan></text><rect x="956.5" y="28" width="295.5" height="196" rx="18" fill="#ffffff" stroke="#e6e1f4"/><text x="978.5" y="62" fill="#7C5CC4" font-size="14" font-weight="800" letter-spacing="2.5">4 · APP</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="978.5" y="96.0">Reply, escalate or</tspan><tspan x="978.5" y="120.2">rate</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="978.5" y="154.3">Frustration or a request for a</tspan><tspan x="978.5" y="176.1">person goes to a human;</tspan><tspan x="978.5" y="197.8">resolved chats ask for a</tspan><tspan x="978.5" y="219.6">rating.</tspan></text></svg>